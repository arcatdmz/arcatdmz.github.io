name: Publish assets
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish-assets:
    name: publish-assets
    runs-on: ubuntu-latest
    steps:
      - name: Set env vars
        run: echo "VERSION=${GITHUB_REF/refs\/tags\/v/}" >> ${GITHUB_ENV}
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Restore image derivatives
        uses: actions/cache@v5.1.0
        with:
          path: .cache/site-images
          key: site-images-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'scripts/image-derivatives.ts') }}-${{ hashFiles('src/**/*.[pP][nN][gG]', 'src/**/*.[jJ][pP][gG]', 'src/**/*.[jJ][pP][eE][gG]', 'src/**/*.[wW][eE][bB][pP]') }}
          restore-keys: |
            site-images-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'scripts/image-derivatives.ts') }}-
            site-images-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Build package
        run: npm run build
      - name: Archive assets
        run: cd dist && zip -r ../stylesheets-${VERSION}.zip stylesheets/main.* fonts semantic/themes/default
      - name: Upload assets
        uses: softprops/action-gh-release@v3
        with:
          files: stylesheets-${{ env.VERSION }}.zip
