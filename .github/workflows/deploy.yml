name: Publish
on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        # Next's platform-specific SWC compiler is an optional npm dependency.
        run: npm ci
      - name: Restore image derivatives
        uses: actions/cache@v5.1.0
        with:
          path: .cache/site-images
          # Only changed image inputs/settings create a new snapshot. Restore
          # the previous image set to reuse unchanged content-addressed entries.
          key: site-images-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'scripts/image-derivatives.ts') }}-${{ hashFiles('src/**/*.[pP][nN][gG]', 'src/**/*.[jJ][pP][gG]', 'src/**/*.[jJ][pP][eE][gG]', 'src/**/*.[wW][eE][bB][pP]') }}
          restore-keys: |
            site-images-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'scripts/image-derivatives.ts') }}-
            site-images-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Build pages
        run: npm run build
      - name: Test built pages
        run: npm test
      - name: Add CNAME
        run: echo junkato.jp > ./dist/CNAME
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
